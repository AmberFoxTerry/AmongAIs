<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Among Us</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="game">

        <header id="topbar">
            <div>
                <h1>AI Among Us</h1>
                <div id="status">Connecting...</div>
            </div>

            <button id="newGame">
                New Game
            </button>
        </header>

        <section id="spectator">

            <div id="mapContainer">
                <canvas id="map"></canvas>

                <div id="cameraHelp">
                    Drag to move camera · Scroll to zoom
                </div>
            </div>

            <aside id="sidebar">

                <section class="panel">
                    <h2>Game</h2>

                    <div id="gameInfo">
                        Loading...
                    </div>
                </section>

                <section class="panel">
                    <h2>AI Crew</h2>

                    <div id="crew"></div>
                </section>

                <section class="panel">
                    <h2>Events</h2>

                    <div id="events"></div>
                </section>

            </aside>

        </section>

    </main>

    <script src="game.js"></script>

</body>
</html>
